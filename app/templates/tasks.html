{% extends "base.html" %}

{% block title %}Tasks{% endblock %}

{% block content %}
<div class="container">
  <h1 class="page-title">Tasks</h1>
  <p class="page-subtitle">Create and manage your study tasks.</p>

  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/tasks-page">Tasks</a>
    <a href="/modules-page">Modules</a>
    <a href="/deadlines-page">Deadlines</a>
  </div>

  <div class="section-box" style="margin-bottom: 1.5rem;">
    <h2>Add task</h2>

    <form id="create-task-form" class="auth-form" style="max-width: 520px;">
      <div class="form-group">
        <label for="task_title">Title</label>
        <input
          type="text"
          id="task_title"
          name="task_title"
          placeholder="e.g. Finish database assignment"
          required
        >
      </div>

      <div class="form-group">
        <label for="task_description">Description (optional)</label>
        <input
          type="text"
          id="task_description"
          name="task_description"
          placeholder="Short description"
        >
      </div>

      <div class="form-group">
        <label for="task_module_id">Module (optional)</label>
        <select id="task_module_id" name="task_module_id">
          <option value="">No module</option>
        </select>
      </div>

      <div class="form-group">
        <label for="task_status">Status</label>
        <select id="task_status" name="task_status">
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </div>

      <div class="form-group">
        <label for="task_priority">Priority</label>
        <select id="task_priority" name="task_priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="form-group">
        <label for="task_due_date">Due date (optional)</label>
        <input
          type="date"
          id="task_due_date"
          name="task_due_date"
        >
      </div>

      <div class="form-group">
        <label for="task_is_exam">Exam task?</label>
        <select id="task_is_exam" name="task_is_exam">
          <option value="false" selected>No</option>
          <option value="true">Yes</option>
        </select>
      </div>

      <button type="submit">Add task</button>
    </form>
  </div>

  <div class="section-box">
    <h2>All tasks</h2>

    <div class="task-filters">
      <div class="form-group">
        <label for="filter_status">Status</label>
        <select id="filter_status" name="filter_status">
          <option value="">All</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </div>

      <div class="form-group">
        <label for="filter_module">Module</label>
        <select id="filter_module" name="filter_module">
          <option value="">All modules</option>
        </select>
      </div>
    </div>

    <ul class="task-list" id="tasks-list">
      <li>Loading tasks...</li>
    </ul>
  </div>
</div>
{% endblock %}
