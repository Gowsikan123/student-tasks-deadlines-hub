<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Student Study Planner{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="logo">Student Study Planner</a>

      <nav class="main-nav">
        <a href="/">Dashboard</a>
        <a href="/tasks-page">Tasks</a>
        <a href="/modules-page">Modules</a>
        <a href="/deadlines-page">Deadlines</a>
        <a href="/login-page">Login</a>
        <a href="/register-page">Register</a>
        <a href="/docs" target="_blank" rel="noopener noreferrer">API Docs</a>
        <a href="/study-sessions-page">Study Sessions</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
